version: 2

models:
  - name: stg_daily_prices
    description: >
      Cleaned, deduplicated daily price and volume data from CoinGecko.
      One row per coin per day. Prices in USD.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [coin_id, price_date]
    columns:
      - name: coin_id
        description: "CoinGecko identifier (e.g., 'bitcoin', 'ethereum')"
        data_tests: [not_null]
      - name: price_date
        description: "Date of the price observation (UTC)"
        data_tests: [not_null]
      - name: price_usd
        description: "Closing price in USD"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: market_cap_usd
        description: "Market capitalization in USD"
      - name: volume_usd
        description: "24-hour trading volume in USD"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: stg_exchange_volumes
    description: >
      Daily snapshot of 24h trading volume for top crypto exchanges.
      One row per exchange per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [exchange_id, snapshot_date]
    columns:
      - name: exchange_id
        description: "CoinGecko exchange identifier"
        data_tests: [not_null]
      - name: exchange_name
        description: "Human-readable exchange name"
        data_tests: [not_null]
      - name: volume_btc_24h
        description: "24-hour trading volume denominated in BTC"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: trust_score
        description: "CoinGecko trust score (1-10)"
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 10
      - name: snapshot_date
        description: "Date this snapshot was taken"
        data_tests: [not_null]

