x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    # Warehouse connection (must match init_db.sql)
    POSTGRES_HOST: warehouse
    POSTGRES_DB: crypto
    POSTGRES_USER: crypto_user
    POSTGRES_PASSWORD: crypto_pass
    POSTGRES_PORT: "5432"
    COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
  volumes:
    - ./dags:/opt/airflow/dags
    - ./extract:/opt/airflow/extract
    - ./config:/opt/airflow/config
    - ./dbt_project:/opt/airflow/dbt_project
    - ./logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # Databases
  warehouse:
    image: postgres:16
    container_name: crypto_warehouse
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_pass
    ports:
      - "5433:5432" # avoid conflict with local Postgres
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      # init scripts run in filename order on first start of a fresh volume
      - ./init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
      - ./sql/create_mcp_reader_role.sql:/docker-entrypoint-initdb.d/02_mcp_reader.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto"]
      interval: 5s
      retries: 5

  airflow-db: # Separate metadata DB keeps Airflow internals isolated from the warehouse
    image: postgres:16
    container_name: airflow_db
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 5

  # Superset
  superset-db:
    image: postgres:16
    container_name: superset_db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      retries: 5

  # One-time init: DB migrate, admin user, warehouse connection
  superset-init:
    image: apache/superset:latest
    container_name: superset_init
    user: root
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-supersecret-change-me-in-production}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - ./superset/superset-init.sh:/app/superset-init.sh
      - superset_home:/app/superset_home
    entrypoint: /bin/bash /app/superset-init.sh
    depends_on:
      superset-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    restart: "no"

  superset:
    image: apache/superset:latest
    container_name: superset
    user: root
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-supersecret-change-me-in-production}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    entrypoint: >
      bash -c "pip install psycopg2-binary --target /app/.venv/lib/python3.10/site-packages/ --quiet &&
               /usr/bin/run-server.sh"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: always

  # Airflow
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
        echo "Airflow init complete."
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    user: "1000:0"
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    user: "1000:0"
    command: >
      bash -c "pip install dbt-postgres requests --quiet && airflow scheduler"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  warehouse_data:
  airflow_db_data:
  superset_db_data:
  superset_home:
